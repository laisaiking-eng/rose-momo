<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>玫瑰雲端記事簿</title>
    <!-- 引入 Firebase JS SDK (Compat 版本) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <link rel="icon" type="image/png" href="icon.png">
    <style>
        body { font-family: sans-serif; background-color: #ffe0f0; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .container { background-color: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); text-align: center; width: 90%; max-width: 400px; }
        h1 { color: #ff6699; font-size: 1.5em; margin-bottom: 20px; }
        input[type="text"] { width: 80%; padding: 10px; font-size: 16px; border: 1px solid #ffccdd; border-radius: 8px; margin-bottom: 10px; text-align: center; }
        textarea { width: 100%; height: 220px; border: 1px solid #ffccdd; border-radius: 8px; padding: 10px; font-size: 16px; box-sizing: border-box; }
        button { background-color: #ff6699; color: white; border: none; border-radius: 20px; padding: 10px 20px; font-size: 16px; cursor: pointer; margin-top: 10px; }
        button:hover { background-color: #ff3377; }
        #notes-area { display: none; }
    </style>
</head>
<body>

<div class="container">
    <h1>🌹 玫瑰雲端記事簿 🌹</h1>

    <!-- 暱稱輸入區 -->
    <div id="login-area">
        <p>請輸入您的名字或暱稱：</p>
        <input type="text" id="usernameInput" placeholder="例如：Momo">
        <br>
        <button id="enterButton">進入記事簿</button>
    </div>

    <!-- 記事本區 -->
    <div id="notes-area">
        <p id="welcomeMsg" style="color:#555; font-weight:bold;"></p>
        <textarea id="myNotes" placeholder="在這裡輸入你的記事...資料會自動同步到雲端 ☁️"></textarea>
        <br>
        <button id="switchUserButton" style="background-color:#999;">切換使用者</button>
    </div>
</div>

<script>
    // Firebase 金鑰設定
    const firebaseConfig = {
        apiKey: "AIzaSyCqYrm1V9GeMiP7MJnXDCbuFWJ5BYM2DeE",
        authDomain: "my-rose-notes.firebaseapp.com",
        projectId: "my-rose-notes",
        storageBucket: "my-rose-notes.firebasestorage.app",
        messagingSenderId: "726041901274",
        appId: "1:726041901274:web:905d250e675ab388bf8de3",
        measurementId: "G-1925WS7KZC",
        databaseURL: "https://my-rose-notes-default-rtdb.firebaseio.com"
    };

    // 初始化 Firebase
    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    const loginArea = document.getElementById('login-area');
    const notesArea = document.getElementById('notes-area');
    const usernameInput = document.getElementById('usernameInput');
    const enterButton = document.getElementById('enterButton');
    const switchUserButton = document.getElementById('switchUserButton');
    const welcomeMsg = document.getElementById('welcomeMsg');
    const myNotesTextArea = document.getElementById('myNotes');

    let currentUser = localStorage.getItem('rose_notes_user');

    if (currentUser) {
        showNotes(currentUser);
    }

    enterButton.addEventListener('click', () => {
        const name = usernameInput.value.trim();
        if (!name) {
            alert('請輸入名字或暱稱！');
            return;
        }
        localStorage.setItem('rose_notes_user', name);
        showNotes(name);
    });

    switchUserButton.addEventListener('click', () => {
        localStorage.removeItem('rose_notes_user');
        loginArea.style.display = 'block';
        notesArea.style.display = 'none';
        usernameInput.value = '';
    });

    function showNotes(username) {
        currentUser = username;
        welcomeMsg.innerText = `使用者：${username}`;
        loginArea.style.display = 'none';
        notesArea.style.display = 'block';

        const userNotesRef = database.ref('user_notes/' + username);

        userNotesRef.once('value').then(snapshot => {
            const data = snapshot.val();
            if (data && data.text) {
                myNotesTextArea.value = data.text;
            } else {
                myNotesTextArea.value = '';
            }
        });

        myNotesTextArea.oninput = function() {
            userNotesRef.set({ text: this.value });
        };
    }
</script>

</body>
</html>
