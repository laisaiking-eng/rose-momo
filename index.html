<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>玫瑰雲端記事簿</title>
    <!-- 引入 Firebase JS SDK (Compat 版本) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <link rel="icon" type="image/png" href="icon.png">
    <style>
        body { font-family: sans-serif; background-color: #ffe0f0; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .container { background-color: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); text-align: center; width: 90%; max-width: 400px; }
        h1 { color: #ff6699; font-size: 1.5em; }
        #auth-status { font-size: 0.9em; margin-bottom: 10px; color: #555; }
        #notes-area { display: none; }
        textarea { width: 100%; height: 200px; border: 1px solid #ffccdd; border-radius: 8px; padding: 10px; font-size: 16px; box-sizing: border-box; }
        button { background-color: #ff6699; color: white; border: none; border-radius: 20px; padding: 10px 20px; font-size: 16px; cursor: pointer; margin-top: 10px; }
        button:hover { background-color: #ff3377; }
        button.login-btn { background-color: #4285F4; margin-top: 20px; }
        button.logout-btn { background-color: #999; margin-top: 10px; }
        #login-area { display: block; }
    </style>
</head>
<body>

<div class="container">
    <h1>🌹 玫瑰雲端記事簿 🌹</h1>

    <div id="auth-status">請點擊下方登入</div>

    <div id="login-area">
        <p>請登入您的 Google 帳號以開始使用。</p>
        <button class="login-btn" id="loginButton">用 Google 登入</button>
    </div>

    <div id="notes-area">
        <textarea id="myNotes" placeholder="在這裡輸入你的記事...資料會自動同步到雲端 ☁️"></textarea>
        <button class="logout-btn" id="logoutButton">登出</button>
    </div>
</div>

<script>
    // Firebase 金鑰設定
    const firebaseConfig = {
        apiKey: "AIzaSyCqYrm1V9GeMiP7MJnXDCbuFWJ5BYM2DeE",
        authDomain: "my-rose-notes.firebaseapp.com",
        projectId: "my-rose-notes",
        storageBucket: "my-rose-notes.firebasestorage.app",
        messagingSenderId: "726041901274",
        appId: "1:726041901274:web:905d250e675ab388bf8de3",
        measurementId: "G-1925WS7KZC",
        databaseURL: "https://my-rose-notes-default-rtdb.firebaseio.com"
    };

    // 初始化 Firebase
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const database = firebase.database();

    const authStatusEl = document.getElementById('auth-status');
    const loginAreaEl = document.getElementById('login-area');
    const notesAreaEl = document.getElementById('notes-area');
    const myNotesTextArea = document.getElementById('myNotes');
    const loginButton = document.getElementById('loginButton');
    const logoutButton = document.getElementById('logoutButton');

    // 監聽登入狀態
    auth.onAuthStateChanged(user => {
        if (user) {
            authStatusEl.innerHTML = `歡迎，<b>${user.displayName || '使用者'}</b>`;
            loginAreaEl.style.display = 'none';
            notesAreaEl.style.display = 'block';

            const userNotesRef = database.ref('notes/' + user.uid);

            userNotesRef.once('value').then(snapshot => {
                const data = snapshot.val();
                if (data && data.text) {
                    myNotesTextArea.value = data.text;
                }
            });

            myNotesTextArea.addEventListener('input', function() {
                userNotesRef.set({ text: this.value });
            });

        } else {
            authStatusEl.innerHTML = `未登入`;
            loginAreaEl.style.display = 'block';
            notesAreaEl.style.display = 'none';
            myNotesTextArea.value = '';
        }
    });

    // 點擊登入（改用 Popup 視窗與錯誤捕捉）
    loginButton.addEventListener('click', () => {
        const provider = new firebase.auth.GoogleAuthProvider();
        auth.signInWithPopup(provider).catch(error => {
            alert("登入提示：" + error.message);
        });
    });

    // 登出按鈕
    logoutButton.addEventListener('click', () => {
        auth.signOut().then(() => {
            alert('您已成功登出');
        });
    });
</script>

</body>
</html>
